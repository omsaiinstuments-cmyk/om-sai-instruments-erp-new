<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Om Sai Instruments ERP</title>
<style>
:root{--navy:#12304a;--blue:#1769aa;--bg:#f3f6fa;--line:#dbe3ec;--text:#172534}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}
header{background:var(--navy);color:white;padding:16px}
header h1{margin:0 0 4px;font-size:22px}
.wrap{max-width:1300px;margin:auto;padding:12px}
.notice,.panel,.stat,.sidebar{background:white;border:1px solid var(--line);border-radius:10px}
.notice{padding:10px;background:#fff8e6;border-color:#f3d38a;margin-bottom:12px}
.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:12px}
.sidebar{padding:8px;height:max-content}
.nav{display:block;width:100%;text-align:left;padding:9px;border:0;background:white;border-radius:7px;margin:2px 0;cursor:pointer}
.nav.active{background:#e8f2fc;color:var(--blue);font-weight:bold}
.panel{padding:14px;margin-bottom:12px;min-width:0}
.panel h2{margin:0 0 12px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{padding:12px}
.stat strong{display:block;font-size:22px;overflow-wrap:anywhere}
.stat span,.small{color:#64748b;font-size:12px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white}
.field textarea{min-height:65px}
.btn{border:0;border-radius:7px;background:var(--blue);color:white;padding:9px 12px;cursor:pointer;margin:4px 2px}
.secondary{background:#e8eef5;color:#172534}
.danger{background:#b42318}
.tablewrap{overflow:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:620px;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
th{background:#f7f9fc}
.pill{padding:3px 8px;border-radius:20px;background:#fee4e2;color:#b42318}
.pill.ok{background:#dcfce7;color:#166534}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}
.filters input,.filters select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white}
.actions{white-space:nowrap}
@media(max-width:800px){
.layout{grid-template-columns:1fr}
.sidebar{display:grid;grid-template-columns:repeat(3,1fr)}
.nav{font-size:11px;padding:7px}
.formgrid{grid-template-columns:repeat(2,1fr)}
.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
.formgrid,.filters{grid-template-columns:1fr}
.sidebar{grid-template-columns:repeat(2,1fr)}
}
@media print{
header,.sidebar,.noprint,.btn,.notice{display:none!important}
.layout{display:block}.panel{border:0}table{min-width:0;font-size:10px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
<h1>Om Sai Instruments ERP</h1>
Industrial Instruments • Sales • Purchase • Inventory
</header>

<div class="wrap">
<div class="notice">
<b>महत्त्वाचे:</b> कोड बदलण्यापूर्वी Backup घ्या. Cloud वापरण्यासाठी Supabase Project URL आणि Publishable/Anon Key आवश्यक आहे.
</div>
<div class="layout">
<nav class="sidebar" id="nav"></nav>
<main id="app"></main>
</div>
</div>

<script>
(()=>{"use strict";

const KEY="omSaiInstrumentsERP_v3";
const OLD=["omSaiInstrumentsERP_v2","omSaiInstrumentsERP_v3"];
const CFG="omSaiERP_cloud_config_v1";
const T=["products","customers","suppliers","sales","purchases","stock","serials","payments"];

const empty=()=>Object.fromEntries(T.map(k=>[k,[]]));
function norm(x){
  let d=empty();
  if(x&&typeof x==="object"){
    T.forEach(k=>{if(Array.isArray(x[k]))d[k]=x[k]});
  }
  return d;
}
function load(){
  for(let k of OLD){
    try{
      let x=JSON.parse(localStorage.getItem(k)||"null");
      if(x){
        let d=norm(x.data||x);
        if(T.some(t=>d[t].length))return d;
      }
    }catch(e){}
  }
  return empty();
}

let db=load(),page="dashboard",lang="en",client=null,user=null;
let editingProductId=null;

const menus=[
["dashboard","Dashboard","डॅशबोर्ड"],
["products","Product Master","प्रॉडक्ट"],
["customers","Customer Master","ग्राहक"],
["sales","Sales / Tax Invoice","सेल्स / बिल"],
["purchases","Purchase Entry","खरेदी"],
["stockio","Stock In / Out","स्टॉक आवक-जावक"],
["stockreg","Stock Register","स्टॉक रजिस्टर"],
["serials","Serial Number Register","सिरियल नंबर"],
["suppliers","Supplier Master","सप्लायर"],
["payments","Payment / Outstanding","पेमेंट / बाकी"],
["reports","Reports / Export","रिपोर्ट्स"],
["backup","Backup / Cloud Setup","बॅकअप / क्लाउड"]
];

const $=x=>document.getElementById(x);
const N=x=>Number(x)||0;
const M=x=>"₹"+N(x).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,f)=>a.reduce((s,x)=>s+N(f(x)),0);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function persist(){localStorage.setItem(KEY,JSON.stringify(db))}

function balance(pid){
  let p=db.products.find(x=>x.id===pid);
  if(!p)return 0;
  return N(p.opening)
    +sum(db.stock.filter(x=>x.product===pid&&x.direction==="In"),x=>x.qty)
    +sum(db.purchases.filter(x=>x.product===pid),x=>x.qty)
    -sum(db.stock.filter(x=>x.product===pid&&x.direction==="Out"),x=>x.qty)
    -sum(db.sales.filter(x=>x.product===pid),x=>x.qty);
}

function tbl(head,rows){
  return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${head.length}">No records found</td></tr>`}</tbody></table></div>`;
}

function field(n,t,type="text",req=false,extra=""){
  return `<div class="field"><label>${t}${req?" *":""}</label><input name="${n}" type="${type}" ${req?"required":""} ${extra}></div>`;
}

function sel(n,t,arr,req=true,label=x=>x.name||x.code||x.serial){
  return `<div class="field"><label>${t}</label><select name="${n}" ${req?"required":""}><option value="">Select ${t}</option>${arr.map(x=>`<option value="${esc(x.id)}">${esc(label(x))}</option>`).join("")}</select></div>`;
}

function form(title,fields){
  return `<section class="panel"><h2>${title}</h2><form id="f" class="formgrid">${fields}</form><button class="btn" form="f">Save</button><button class="btn secondary" type="button" onclick="$('f').reset()">Clear</button></section>`;
}

function list(type,heads,cols){
  return tbl([...heads,"Action"],db[type].map(x=>
    `<tr>${cols.map(fn=>`<td>${esc(fn(x))}</td>`).join("")}
    <td><button class="btn danger" onclick="del('${type}','${esc(x.id)}')">Delete</button></td></tr>`
  ));
}

function attach(type,maker){
  let f=$("f");
  if(!f)return;
  f.onsubmit=async e=>{
    e.preventDefault();
    if(!f.reportValidity())return;
    let v=Object.fromEntries(new FormData(f).entries()),r;
    try{r=maker(v)}catch(err){alert(err.message);return}
    if(!r)return;
    r.id=id();
    db[type].push(r);
    try{persist()}catch(err){
      db[type].pop();
      alert("Save failed. Download backup / check storage.");
      return;
    }
    render();
    if(user){
      try{await cloudSave();alert("Saved and synced to cloud.")}
      catch(err){alert("Local save done; cloud sync failed: "+err.message)}
    }else alert("Saved on this device. Cloud login is required for multi-device access.");
  };
}

/* ---------- PRODUCT MASTER: SEARCH, FILTER, DUPLICATE CHECK, EDIT ---------- */

function cleanText(v){
  return String(v??"").trim().replace(/\s+/g," ");
}
function keyText(v){
  return cleanText(v).toLocaleLowerCase();
}
function sameProductCode(code,excludeId=null){
  const k=keyText(code);
  return db.products.some(p=>p.id!==excludeId&&keyText(p.code)===k);
}
function sameProductDetails(v,excludeId=null){
  const name=keyText(v.name),make=keyText(v.make),model=keyText(v.model);
  if(!name)return false;
  return db.products.some(p=>
    p.id!==excludeId&&
    keyText(p.name)===name&&
    keyText(p.make)===make&&
    keyText(p.model)===model
  );
}
function productDuplicateError(v,excludeId=null){
  if(!cleanText(v.code))throw Error("Product Code आवश्यक आहे.");
  if(!cleanText(v.name))throw Error("Product Name आवश्यक आहे.");
  if(sameProductCode(v.code,excludeId))
    throw Error("हा Product Code आधीपासून उपलब्ध आहे. कृपया वेगळा Code वापरा.");
  if(sameProductDetails(v,excludeId)){
    if(!confirm("याच Product Name, Make आणि Model ची नोंद आधीपासून आहे. तरीही हा Product सेव्ह करायचा आहे का?")) {
      throw Error("Duplicate Product Details मुळे सेव्ह रद्द केले.");
    }
  }
}
function resetProductForm(){
  editingProductId=null;
  render();
}
window.cancelProductEdit=resetProductForm;

window.editProduct=pid=>{
  const p=db.products.find(x=>x.id===pid);
  if(!p){alert("Product सापडला नाही.");return}
  editingProductId=p.id;
  render();
  const f=$("f");
  if(!f)return;
  for(const k of ["code","name","make","model","unit","opening","reorder","cost","price"]){
    if(f.elements[k])f.elements[k].value=p[k]??"";
  }
  $("productFormTitle").textContent="Edit Product";
  $("productSaveBtn").textContent="Update Product";
  $("productCancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
};

window.updateProduct=async e=>{
  e.preventDefault();
  const f=$("f");
  if(!f||!f.reportValidity())return;
  const v=Object.fromEntries(new FormData(f).entries());
  const old=db.products.find(x=>x.id===editingProductId);
  if(!old){alert("Edit Product सापडला नाही. पुन्हा निवडा.");resetProductForm();return}
  try{
    productDuplicateError(v,old.id);
    const updated={
      ...old,
      code:cleanText(v.code),
      name:cleanText(v.name),
      make:cleanText(v.make),
      model:cleanText(v.model),
      unit:cleanText(v.unit)||"pcs",
      opening:Math.max(0,N(v.opening)),
      reorder:Math.max(0,N(v.reorder)),
      cost:Math.max(0,N(v.cost)),
      price:Math.max(0,N(v.price))
    };
    const idx=db.products.findIndex(x=>x.id===old.id);
    db.products[idx]=updated;
    try{persist()}catch(err){db.products[idx]=old;throw Error("Save failed. Backup घ्या आणि storage तपासा.")}
    editingProductId=null;
    render();
    if(user){
      try{await cloudSave();alert("Product updated and synced to cloud.")}
      catch(err){alert("Product स्थानिक पातळीवर अपडेट झाला; Cloud Sync अयशस्वी: "+err.message)}
    }else alert("Product अपडेट झाला.");
  }catch(err){alert(err.message)}
};

window.productSearch=()=>renderProductTable();
window.productFilter=()=>renderProductTable();
window.clearProductFilters=()=>{
  if($("productSearch"))$("productSearch").value="";
  if($("makeFilter"))$("makeFilter").value="";
  if($("stockFilter"))$("stockFilter").value="all";
  renderProductTable();
};

function productRows(){
  const q=keyText($("productSearch")?.value||"");
  const mk=keyText($("makeFilter")?.value||"");
  const sf=$("stockFilter")?.value||"all";
  return db.products.filter(p=>{
    const searchText=[p.code,p.name,p.make,p.model,p.unit].map(keyText).join(" ");
    const matchesSearch=!q||searchText.includes(q);
    const matchesMake=!mk||keyText(p.make)===mk;
    const b=balance(p.id),reorder=N(p.reorder);
    const matchesStock=sf==="all"||(sf==="low"&&b<=reorder)||(sf==="available"&&b>reorder);
    return matchesSearch&&matchesMake&&matchesStock;
  });
}

function renderProductTable(){
  if(page!=="products")return;
  const rows=productRows();
  const area=$("productTableArea");
  if(!area)return;
  area.innerHTML=`
    <p class="small">दिसणारे Products: <b>${rows.length}</b> / ${db.products.length}</p>
    ${tbl(["Code","Name","Make / Brand","Model","Unit","Opening","Available Stock","Reorder","Cost","Price","Action"],
      rows.map(p=>{
        const b=balance(p.id),low=b<=N(p.reorder);
        return `<tr>
          <td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.make)}</td>
          <td>${esc(p.model)}</td><td>${esc(p.unit)}</td>
          <td>${N(p.opening)}</td><td>${b}</td><td>${N(p.reorder)}</td>
          <td>${M(p.cost)}</td><td>${M(p.price)}</td>
          <td class="actions">
            <button class="btn" onclick="editProduct('${esc(p.id)}')">Edit</button>
            <button class="btn danger" onclick="del('products','${esc(p.id)}')">Delete</button>
          </td>
        </tr>`;
      })
    )}
  `;
}

/* ---------- NAVIGATION / GENERAL RENDER ---------- */

window.del=async(t,rid)=>{
  if(t==="products"){
    const used=["sales","purchases","stock","serials"].some(k=>db[k].some(x=>x.product===rid));
    if(used){
      if(!confirm("हा Product Sales/Purchase/Stock/Serial नोंदींमध्ये वापरला आहे. हटवल्यास जुन्या नोंदींचे संदर्भ राहू शकतात. तरीही हटवायचा आहे का?"))return;
    }else if(!confirm("हा Product हटवायचा आहे का?"))return;
  }else if(!confirm("Delete this record?"))return;
  db[t]=db[t].filter(x=>x.id!==rid);
  try{persist()}catch(e){alert("Save failed: "+e.message);return}
  if(t==="products"&&editingProductId===rid)editingProductId=null;
  render();
  if(user)try{await cloudSave()}catch(e){alert("Deleted locally but cloud sync failed: "+e.message)}
};

window.go=p=>{page=p;editingProductId=null;render()};
window.toggleLang=()=>{lang=lang==="en"?"mr":"en";render()};

function render(){
  $("nav").innerHTML=menus.map(m=>
    `<button class="nav ${page===m[0]?"active":""}" onclick="go('${m[0]}')">${m[lang==="mr"?2:1]}</button>`
  ).join("")+`<button class="nav" onclick="toggleLang()">${lang==="en"?"मराठी":"English"}</button>`;

  let h="",a=null;

  if(page==="dashboard"){
    h=`<section class="panel"><h2>Dashboard</h2>
    <p class="small">${user?"Cloud: "+esc(user.email):"Local mode — cloud not connected"}</p>
    <div class="stats">${[
      ["Products",db.products.length],["Customers",db.customers.length],
      ["Sales Invoices",db.sales.length],["Suppliers",db.suppliers.length],
      ["Total Sales",M(sum(db.sales,x=>x.total))],["Purchases",M(sum(db.purchases,x=>x.total))]
    ].map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join("")}</div></section>
    <section class="panel"><h2>Low Stock Alert</h2>
    ${tbl(["Product","Available","Reorder"],db.products.filter(p=>balance(p.id)<=N(p.reorder)).map(p=>
      `<tr><td>${esc(p.name)}</td><td>${balance(p.id)}</td><td>${N(p.reorder)} <span class="pill">Low Stock</span></td></tr>`
    ))}</section>`;
  }

  if(page==="products"){
    const p=editingProductId?db.products.find(x=>x.id===editingProductId):null;
    h=`<section class="panel">
      <h2 id="productFormTitle">${p?"Edit Product":"Add Product"}</h2>
      <form id="f" class="formgrid">
        ${field("code","Product Code","text",true)}
        ${field("name","Product Name","text",true)}
        ${field("make","Make / Brand")}
        ${field("model","Model")}
        ${field("unit","Unit")}
        ${field("opening","Opening Stock","number",false,'min="0" step="any"')}
        ${field("reorder","Reorder Level","number",false,'min="0" step="any"')}
        ${field("cost","Purchase Cost ₹","number",false,'min="0" step="any"')}
        ${field("price","Selling Price ₹","number",false,'min="0" step="any"')}
      </form>
      <button class="btn" id="productSaveBtn" form="f">${p?"Update Product":"Save Product"}</button>
      <button class="btn secondary" id="productCancelBtn" type="button" onclick="cancelProductEdit()" style="${p?"":"display:none"}">Cancel Edit</button>
      <p class="small">Product Code duplicate असल्यास सेव्ह होणार नाही. Product Name + Make + Model जुळल्यास duplicate warning मिळेल.</p>
    </section>
    <section class="panel">
      <h2>Product Search & Filters</h2>
      <div class="filters">
        <input id="productSearch" placeholder="Search code, name, make, model..." oninput="productSearch()">
        <select id="makeFilter" onchange="productFilter()">
          <option value="">All Makes / Brands</option>
          ${[...new Set(db.products.map(p=>cleanText(p.make)).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("")}
        </select>
        <select id="stockFilter" onchange="productFilter()">
          <option value="all">All Stock Status</option>
          <option value="low">Low Stock</option>
          <option value="available">Above Reorder Level</option>
        </select>
        <button type="button" class="btn secondary" onclick="clearProductFilters()">Clear Filters</button>
      </div>
      <div id="productTableArea"></div>
    </section>`;
    a=["products",v=>{
      productDuplicateError(v,null);
      return {
        code:cleanText(v.code),name:cleanText(v.name),make:cleanText(v.make),
        model:cleanText(v.model),unit:cleanText(v.unit)||"pcs",
        opening:Math.max(0,N(v.opening)),reorder:Math.max(0,N(v.reorder)),
        cost:Math.max(0,N(v.cost)),price:Math.max(0,N(v.price))
      };
    }];
  }

  if(page==="customers"||page==="suppliers"){
    let t=page;
    h=form("Add "+(t==="customers"?"Customer":"Supplier"),
      field("name","Name","text",true)+field("mobile","Mobile")+
      field("email","Email","email")+field("gstin","GSTIN")+
      field("city","City")+field("address","Address")
    )+`<section class="panel"><h2>${t} List</h2>
      ${list(t,["Name","Mobile","Email","GSTIN","City","Address"],[x=>x.name,x=>x.mobile,x=>x.email,x=>x.gstin,x=>x.city,x=>x.address])}
    </section>`;
    a=[t,v=>({name:v.name.trim(),mobile:v.mobile,email:v.email,gstin:v.gstin,city:v.city,address:v.address})];
  }

  if(page==="sales"||page==="purchases"){
    let sale=page==="sales",t=sale?"sales":"purchases",parties=sale?db.customers:db.suppliers;
    h=form(sale?"Sales Tax Invoice":"Purchase Entry",
      field("doc","Invoice / Bill No.","text",true)+sel("party",sale?"Customer":"Supplier",parties)+
      field("date","Date","date",true)+sel("product","Product",db.products)+
      field("qty","Quantity","number",true,'min=".001" step="any"')+
      field("rate","Rate ₹","number",true,'min="0" step="any"')+
      field("gst","GST %","number",false,'min="0" max="100" step="any"')+
      field("paid","Paid ₹","number",false,'min="0" step="any"')
    )+`<section class="panel"><h2>${sale?"Sales Invoices":"Purchase Bills"}</h2>
    ${list(t,["No.","Party","Date","Product","Qty","Taxable","GST","Total","Paid","Balance"],
      [x=>x.doc,x=>x.partyName,x=>x.date,x=>x.productName,x=>x.qty,x=>M(x.subtotal??x.total),x=>M(x.gstAmount),x=>M(x.total),x=>M(x.paid),x=>M(x.total-x.paid)])}
    <button class="btn secondary" onclick="csv('${t}')">Export CSV</button></section>`;
    a=[t,v=>{
      let p=db.products.find(x=>x.id===v.product),party=parties.find(x=>x.id===v.party);
      if(!p||!party)throw Error("Select product and party.");
      if(db[t].some(x=>keyText(x.doc)===keyText(v.doc)))throw Error("Document number already exists.");
      let qty=N(v.qty),rate=N(v.rate),gst=N(v.gst),subtotal=qty*rate,gstAmount=subtotal*gst/100,total=subtotal+gstAmount,paid=N(v.paid);
      if(qty<=0||rate<0||gst<0||gst>100||paid<0||paid>total)throw Error("Check quantity, GST and payment.");
      if(sale&&qty>balance(p.id))throw Error("Insufficient stock. Available: "+balance(p.id));
      return {doc:v.doc.trim(),partyId:party.id,partyName:party.name,date:v.date,product:p.id,productName:p.name,qty,rate,gst,subtotal,gstAmount,total,paid};
    }];
  }

  if(page==="stockio"){
    h=form("Stock In / Out",
      sel("product","Product",db.products,true,p=>p.name+" (Available "+balance(p.id)+")")+
      '<div class="field"><label>Direction</label><select name="direction"><option>In</option><option>Out</option></select></div>'+
      field("qty","Quantity","number",true,'min=".001" step="any"')+
      field("date","Date","date",true)+field("reference","Reference")+field("notes","Notes")
    )+`<section class="panel"><h2>Stock History</h2>
    ${list("stock",["Date","Product","Direction","Qty","Reference","Notes"],[x=>x.date,x=>db.products.find(p=>p.id===x.product)?.name||"",x=>x.direction,x=>x.qty,x=>x.reference,x=>x.notes])}
    </section>`;
    a=["stock",v=>{
      if(!db.products.some(p=>p.id===v.product)||N(v.qty)<=0)throw Error("Select product and valid quantity.");
      if(v.direction==="Out"&&N(v.qty)>balance(v.product))throw Error("Insufficient stock.");
      return {product:v.product,direction:v.direction,qty:N(v.qty),date:v.date,reference:v.reference,notes:v.notes};
    }];
  }

  if(page==="stockreg"){
    h=`<section class="panel"><h2>Stock Register</h2>
    <button class="btn secondary" onclick="csv('stockreg')">Export CSV</button>
    ${tbl(["Code","Product","Opening","In","Out","Balance","Status"],db.products.map(p=>{
      let i=sum(db.stock.filter(x=>x.product===p.id&&x.direction==="In"),x=>x.qty)+sum(db.purchases.filter(x=>x.product===p.id),x=>x.qty);
      let o=sum(db.stock.filter(x=>x.product===p.id&&x.direction==="Out"),x=>x.qty)+sum(db.sales.filter(x=>x.product===p.id),x=>x.qty);
      let b=balance(p.id);
      return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${N(p.opening)}</td><td>${i}</td><td>${o}</td><td>${b}</td><td>${b<=N(p.reorder)?'<span class="pill">LOW</span>':'<span class="pill ok">OK</span>'}</td></tr>`;
    }))}</section>`;
  }

  if(page==="serials"){
    h=form("Serial Number Register",
      sel("product","Product",db.products)+field("serial","Serial Number","text",true)+
      '<div class="field"><label>Status</label><select name="status"><option>In Stock</option><option>Sold</option><option>Under Calibration</option><option>Sent for Repair</option></select></div>'+
      field("customer","Customer / Location")+field("calibration","Last Calibration","date")+
      field("nextcal","Next Calibration Due","date")+field("certificate","Certificate No.")+
      field("warranty","Warranty Until","date")
    )+`<section class="panel"><h2>Serial Register</h2>
    ${list("serials",["Product","Serial","Status","Customer","Last Cal.","Next Due","Certificate","Warranty"],
      [x=>db.products.find(p=>p.id===x.product)?.name||"",x=>x.serial,x=>x.status,x=>x.customer,x=>x.calibration,x=>x.nextcal,x=>x.certificate,x=>x.warranty])}
    </section>`;
    a=["serials",v=>{
      if(db.serials.some(x=>keyText(x.serial)===keyText(v.serial)))throw Error("Serial number already exists.");
      return {...v,serial:cleanText(v.serial)};
    }];
  }

  if(page==="payments"){
    h=form("Payment Entry",
      '<div class="field"><label>Type</label><select name="type"><option>Receipt from Customer</option><option>Payment to Supplier</option></select></div>'+
      field("party","Party","text",true)+field("date","Date","date",true)+
      field("amount","Amount ₹","number",true,'min=".01" step="any"')+
      field("reference","Invoice / Reference")+field("notes","Notes")
    )+`<section class="panel"><h2>Payments</h2>
    ${list("payments",["Type","Party","Date","Amount","Reference","Notes"],[x=>x.type,x=>x.party,x=>x.date,x=>M(x.amount),x=>x.reference,x=>x.notes])}
    </section>
    <section class="panel"><h2>Invoice Outstanding</h2>
    ${tbl(["Type","Party","Doc","Total","Paid","Balance"],[
      ...db.sales.map(x=>`<tr><td>Sale</td><td>${esc(x.partyName)}</td><td>${esc(x.doc)}</td><td>${M(x.total)}</td><td>${M(x.paid)}</td><td>${M(x.total-x.paid)}</td></tr>`),
      ...db.purchases.map(x=>`<tr><td>Purchase</td><td>${esc(x.partyName)}</td><td>${esc(x.doc)}</td><td>${M(x.total)}</td><td>${M(x.paid)}</td><td>${M(x.total-x.paid)}</td></tr>`)
    ])}</section>`;
    a=["payments",v=>{
      if(N(v.amount)<=0)throw Error("Enter valid amount.");
      return {...v,amount:N(v.amount)};
    }];
  }

  if(page==="reports"){
    h=`<section class="panel"><h2>Reports</h2>
    <p>Sales: <b>${M(sum(db.sales,x=>x.total))}</b></p>
    <p>Purchases: <b>${M(sum(db.purchases,x=>x.total))}</b></p>
    <p>Sales outstanding: <b>${M(sum(db.sales,x=>x.total-x.paid))}</b></p>
    <p>Purchase outstanding: <b>${M(sum(db.purchases,x=>x.total-x.paid))}</b></p>
    <button class="btn" onclick="printInvoice()">Print / Save PDF</button>
    ${T.map(t=>`<button class="btn secondary" onclick="csv('${t}')">${t} CSV</button>`).join("")}
    <button class="btn secondary" onclick="csv('stockreg')">Stock CSV</button></section>`;
  }

  if(page==="backup"){
    h=`<section class="panel"><h2>Backup / Restore</h2>
    <button class="btn" onclick="backup()">Download JSON Backup</button>
    <div class="field"><label>Restore JSON</label><input type="file" accept=".json,application/json" onchange="restore(event)"></div>
    <hr><h2>Cloud Database Setup</h2>
    <p class="small">Supabase Project URL आणि Publishable/Anon Key भरा. SQL Editor मध्ये खालील SQL एकदाच चालवा.</p>
    <div class="formgrid">
      <div class="field"><label>Project URL</label><input id="url" placeholder="https://project.supabase.co"></div>
      <div class="field"><label>Publishable Key</label><input id="key" placeholder="sb_publishable_..."></div>
    </div>
    <button class="btn" onclick="setup()">Save Cloud Settings</button>
    <div class="formgrid">
      <div class="field"><label>Login Email</label><input id="email" type="email"></div>
      <div class="field"><label>Password (8+ characters)</label><input id="password" type="password"></div>
    </div>
    <button class="btn" onclick="signup()">Create Login</button>
    <button class="btn secondary" onclick="login()">Login</button>
    <button class="btn secondary" onclick="logout()">Logout</button>
    <button class="btn" onclick="sync()">Sync / Merge Cloud</button>
    <p id="cloudStatus" class="small">${user?"Logged in: "+esc(user.email):"Not connected"}</p>
    <p class="small">Supabase → SQL Editor मध्ये चालवा:</p>
    <pre id="sql" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fc;padding:10px">create table if not exists public.erp_data (
  user_id uuid primary key references auth.users(id) on delete cascade,
  payload jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table public.erp_data enable row level security;
create policy "read own ERP" on public.erp_data for select to authenticated using (auth.uid() = user_id);
create policy "insert own ERP" on public.erp_data for insert to authenticated with check (auth.uid() = user_id);
create policy "update own ERP" on public.erp_data for update to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);</pre>
    <button class="btn secondary" onclick="navigator.clipboard.writeText($('sql').textContent).then(()=>alert('SQL copied')).catch(()=>alert('Select and copy SQL manually'))">Copy SQL</button>
    <p class="small">Cloud sync is a basic single-user setup. Back up regularly. Avoid simultaneous edits on multiple devices until conflict-safe sync is implemented. Never place a Supabase Secret/service_role key in this file.</p>
    </section>`;
  }

  $("app").innerHTML=h;

  if(page==="products"){
    if(editingProductId){
      const p=db.products.find(x=>x.id===editingProductId);
      if(p){
        const f=$("f");
        ["code","name","make","model","unit","opening","reorder","cost","price"].forEach(k=>{
          if(f.elements[k])f.elements[k].value=p[k]??"";
        });
        $("productFormTitle").textContent="Edit Product";
        $("productSaveBtn").textContent="Update Product";
        $("productCancelBtn").style.display="inline-block";
        f.onsubmit=window.updateProduct;
      }
    }else attach("products",a[1]);
    renderProductTable();
  }else if(a)attach(a[0],a[1]);

  if(page==="backup"){
    let c=cfg();
    $("url").value=c.url||"";
    $("key").value=c.key||"";
  }
}

/* ---------- BACKUP / CSV ---------- */

window.backup=()=>{
  let b=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),data:db},null,2)],{type:"application/json"});
  let u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="om-sai-erp-backup-"+today()+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};

window.restore=e=>{
  let f=e.target.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let x=JSON.parse(r.result);
      if(!confirm("Restore replaces local data. Continue?"))return;
      db=norm(x.data||x);persist();render();
      alert("Local backup restored. Check data before cloud sync.");
    }catch(err){alert("Invalid JSON backup")}
  };
  r.readAsText(f);
};

window.csv=t=>{
  let rows;
  if(t==="stockreg"){
    rows=[["Code","Product","Opening","Balance"],...db.products.map(p=>[p.code,p.name,p.opening,balance(p.id)])];
  }else{
    let arr=db[t]||[],keys=arr.length?Object.keys(arr[0]):[];
    rows=[keys,...arr.map(x=>keys.map(k=>x[k]))];
  }
  let s="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  let b=new Blob([s],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=t+"-"+today()+".csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};
window.printInvoice=()=>window.print();

/* ---------- SUPABASE AUTH / CLOUD SYNC ---------- */

function cfg(){
  try{return JSON.parse(localStorage.getItem(CFG)||"{}")}catch(e){return {}}
}
function init(){
  let c=cfg();
  if(!c.url||!c.key||!window.supabase)return null;
  client=window.supabase.createClient(c.url,c.key);
  return client;
}

window.setup=()=>{
  let url=$("url").value.trim().replace(/\/+$/,""),key=$("key").value.trim();
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)||!key){
    alert("Enter valid project URL and Publishable Key");return;
  }
  localStorage.setItem(CFG,JSON.stringify({url,key}));
  init();alert("Settings saved. Create account or login.");
};

window.signup=async()=>{
  try{
    let c=init(),email=$("email").value.trim(),password=$("password").value;
    if(!c)throw Error("Save cloud settings first");
    if(password.length<8)throw Error("Password must be at least 8 characters");
    let {error}=await c.auth.signUp({email,password});
    if(error)throw error;
    alert("Signup sent. Check email confirmation if enabled, then login.");
  }catch(e){alert(e.message)}
};

window.login=async()=>{
  try{
    let c=init();
    if(!c)throw Error("Save cloud settings first");
    let {data,error}=await c.auth.signInWithPassword({
      email:$("email").value.trim(),password:$("password").value
    });
    if(error)throw error;
    user=data.user;render();alert("Login successful. Press Sync / Merge Cloud.");
  }catch(e){alert("Login failed: "+e.message)}
};

window.logout=async()=>{
  try{
    if(client)await client.auth.signOut();
    user=null;render();alert("Logged out. Local data remains.");
  }catch(e){alert(e.message)}
};

async function cloudSave(){
  let c=init();
  if(!c)throw Error("Cloud config missing");
  let {data:{user:u},error:ue}=await c.auth.getUser();
  if(ue)throw ue;
  if(!u)throw Error("Login first");
  let {error}=await c.from("erp_data").upsert({
    user_id:u.id,payload:db,updated_at:new Date().toISOString()
  },{onConflict:"user_id"});
  if(error)throw error;
  user=u;
}

window.sync=async()=>{
  try{
    let c=init();
    if(!c)throw Error("Save cloud settings first");
    let {data:{user:u},error:ue}=await c.auth.getUser();
    if(ue)throw ue;
    if(!u)throw Error("Login first");
    user=u;
    let {data,error}=await c.from("erp_data").select("payload").eq("user_id",u.id).maybeSingle();
    if(error)throw error;
    if(data&&data.payload){
      let remote=norm(data.payload),merged=empty();
      T.forEach(t=>{
        let m=new Map();
        remote[t].forEach(x=>{if(x&&x.id)m.set(x.id,x)});
        db[t].forEach(x=>{if(x&&x.id)m.set(x.id,x)});
        merged[t]=[...m.values()];
      });
      db=merged;
    }
    persist();
    await cloudSave();
    render();
    alert("Sync complete. Local and cloud records merged by ID.");
  }catch(e){
    alert("Sync failed: "+e.message+"\nLocal data remains. Download backup and check setup.");
  }
};

try{persist()}catch(e){}
render();

try{
  let c=init();
  if(c)c.auth.getSession().then(({data})=>{
    if(data.session){user=data.session.user;render()}
  });
}catch(e){}

})();
</script>
